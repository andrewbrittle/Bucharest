<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan, Four Cities</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
  (function(){
    var m = location.search.match(/[?&]theme=(light|dark)/);
    if (m) document.documentElement.setAttribute('data-theme', m[1]);
  })();
</script>
<style>
  :root{
    --bg:#14181C;
    --surface:#1D242A;
    --surface-hi:#262F37;
    --line:#313B43;
    --text:#F3EEE3;
    --text-dim:#A3AFB8;
    --text-faint:#7C8A94;
    --toggle-bg:#262F37;
    --toggle-icon:#D4A64C;

    --tok:#4A90C4; --tok-dim:#1B3247; --tok-text:#B7D9F0; --tok-border:#254257;
    --kyo:#BE5F35; --kyo-dim:#5A3324; --kyo-text:#F0C4A8; --kyo-border:#4A2E22;
    --tak:#5E9B5C; --tak-dim:#223A24; --tak-text:#BFE2BC; --tak-border:#2C4A2C;
    --kan:#D4A64C; --kan-dim:#5C4A26; --kan-text:#F0D999; --kan-border:#4A3D22;

    --transit-bg:#132A20; --transit-border:#3FA06B; --transit-icon:#7FDDA5;
    --hotel-bg:#241D14; --hotel-border:#B08838; --hotel-icon:#E4BE6F;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F6F1E6; --surface:#FFFFFF; --surface-hi:#F1EADC; --line:#E3D9C6;
      --text:#241F18; --text-dim:#5C5042; --text-faint:#7A6F60;
      --toggle-bg:#FFFFFF; --toggle-icon:#A9791F;

      --tok:#255E8C; --tok-dim:#DCEAF5; --tok-text:#17456B; --tok-border:#BEDAEC;
      --kyo:#A8501F; --kyo-dim:#F1DAC3; --kyo-text:#8C3E17; --kyo-border:#E3C6A8;
      --tak:#3F6B3D; --tak-dim:#DEEEDC; --tak-text:#2C4A2A; --tak-border:#C3DFC0;
      --kan:#A9791F; --kan-dim:#F3E6BE; --kan-text:#7A5813; --kan-border:#E3CE8F;

      --transit-bg:#E3F3EA; --transit-border:#2F7D4F; --transit-icon:#1F6E45;
      --hotel-bg:#FBF2DF; --hotel-border:#A9791F; --hotel-icon:#7A5813;
      color-scheme: light;
    }
  }
  html[data-theme="light"]{
    --bg:#F6F1E6; --surface:#FFFFFF; --surface-hi:#F1EADC; --line:#E3D9C6;
    --text:#241F18; --text-dim:#5C5042; --text-faint:#7A6F60;
    --toggle-bg:#FFFFFF; --toggle-icon:#A9791F;

    --tok:#255E8C; --tok-dim:#DCEAF5; --tok-text:#17456B; --tok-border:#BEDAEC;
    --kyo:#A8501F; --kyo-dim:#F1DAC3; --kyo-text:#8C3E17; --kyo-border:#E3C6A8;
    --tak:#3F6B3D; --tak-dim:#DEEEDC; --tak-text:#2C4A2A; --tak-border:#C3DFC0;
    --kan:#A9791F; --kan-dim:#F3E6BE; --kan-text:#7A5813; --kan-border:#E3CE8F;

    --transit-bg:#E3F3EA; --transit-border:#2F7D4F; --transit-icon:#1F6E45;
    --hotel-bg:#FBF2DF; --hotel-border:#A9791F; --hotel-icon:#7A5813;
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#14181C; --surface:#1D242A; --surface-hi:#262F37; --line:#313B43;
    --text:#F3EEE3; --text-dim:#A3AFB8; --text-faint:#7C8A94;
    --toggle-bg:#262F37; --toggle-icon:#D4A64C;

    --tok:#4A90C4; --tok-dim:#1B3247; --tok-text:#B7D9F0; --tok-border:#254257;
    --kyo:#BE5F35; --kyo-dim:#5A3324; --kyo-text:#F0C4A8; --kyo-border:#4A2E22;
    --tak:#5E9B5C; --tak-dim:#223A24; --tak-text:#BFE2BC; --tak-border:#2C4A2C;
    --kan:#D4A64C; --kan-dim:#5C4A26; --kan-text:#F0D999; --kan-border:#4A3D22;

    --transit-bg:#132A20; --transit-border:#3FA06B; --transit-icon:#7FDDA5;
    --hotel-bg:#241D14; --hotel-border:#B08838; --hotel-icon:#E4BE6F;
    color-scheme: dark;
  }

  body{ transition: background .25s ease, color .25s ease; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{ max-width:460px; margin:0 auto; padding:28px 20px 60px; position:relative; min-height:100vh; }

  .eyebrow{ font-size:13.5px; color:var(--text-dim); letter-spacing:.02em; margin-bottom:6px; }
  h1{ font-family:'Fraunces', serif; font-optical-sizing:auto; font-weight:500; font-size:32px; line-height:1.12; margin:0 0 4px; text-wrap:balance; }
  .daterange{ color:var(--text-dim); font-size:15.5px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }

  .word-link{
    display:inline-block; padding:4px 11px; border-radius:20px; text-decoration:none;
    border:1px solid var(--text-faint); color:var(--text-dim); background:none; appearance:none;
    font-family:inherit; font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    cursor:pointer; transition:transform .15s ease, opacity .15s ease, background .15s ease, color .15s ease;
    flex-shrink:0;
  }
  .word-link:active{ transform:scale(0.94); }
  .word-link.selected{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .timeline{ display:flex; height:38px; border-radius:9px; overflow:hidden; margin-bottom:16px; }
  .timeline .seg{ display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600; letter-spacing:.02em; border-right:1px solid var(--bg); }
  .timeline .seg:last-child{ border-right:none; }
  .timeline .seg.tok{ background:var(--tok-dim); color:var(--tok-text); }
  .timeline .seg.kyo{ background:var(--kyo-dim); color:var(--kyo-text); }
  .timeline .seg.tak{ background:var(--tak-dim); color:var(--tak-text); }
  .timeline .seg.kan{ background:var(--kan-dim); color:var(--kan-text); }

  .weekgrid{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .day{
    flex:0 0 calc((100% - 42px)/8);
    aspect-ratio:1/1.12; background:var(--surface); border:1px solid var(--line); border-radius:9px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    padding:4px 2px; transition:transform .15s ease, background .15s ease, border-color .15s ease; position:relative;
  }
  .day:active{ transform:scale(0.94); }
  .day:hover{ background:var(--surface-hi); }
  .day .num{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; line-height:1; }
  .day .mon{ font-size:8.5px; font-weight:600; color:var(--text-dim); margin-top:2px; letter-spacing:.03em; }
  .day .dot{ width:5px;height:5px;border-radius:50%; margin-top:4px; }
  .day.tok{ border-color:var(--tok-border); } .day.tok .dot{ background:var(--tok); }
  .day.kyo{ border-color:var(--kyo-border); } .day.kyo .dot{ background:var(--kyo); }
  .day.tak{ border-color:var(--tak-border); } .day.tak .dot{ background:var(--tak); }
  .day.kan{ border-color:var(--kan-border); } .day.kan .dot{ background:var(--kan); }
  .day.trip{ border-style:dashed; }
  .day.travel{ background:linear-gradient(135deg, var(--surface-hi), var(--surface)); }
  .day.travel .num{ text-decoration:underline; text-decoration-color:var(--text-faint); text-decoration-style:dotted; text-underline-offset:3px; }
  .day.selected{ background:var(--text); border-color:var(--text); border-style:solid; }
  .day.selected .num, .day.selected .mon{ color:var(--bg); }
  .day.selected .dot{ background:var(--bg); }
  .day.past:not(.selected){ opacity:.42; }
  .day.today{ outline:2px solid var(--transit-border); outline-offset:2px; }
  .day.today .dot{ background:var(--transit-border); }
  .day.today.selected .dot{ background:var(--bg); }

  .weekgrid-note{ font-size:11.5px; color:var(--text-faint); margin:-6px 0 18px; display:flex; gap:14px; flex-wrap:wrap; }
  .weekgrid-note span{ display:inline-flex; align-items:center; gap:5px; }
  .weekgrid-note i{ width:7px;height:7px;border-radius:50%; display:inline-block; }
  .week-divider{ height:1px; background:linear-gradient(90deg, transparent, var(--kan) 15%, var(--kan) 85%, transparent); opacity:.55; margin-bottom:22px; }

  .panel{ animation:panelIn .25s ease; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .detail-date{ font-size:13.5px; color:var(--text-dim); margin-bottom:4px; }
  .detail-title{ font-family:'Fraunces', serif; font-weight:500; font-size:27px; margin:0 0 18px; line-height:1.15; text-wrap:balance; }

  .badge{ display:inline-block; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; margin-bottom:18px; letter-spacing:.02em; }
  .badge.tok{ background:var(--tok-dim); color:var(--tok-text); }
  .badge.kyo{ background:var(--kyo-dim); color:var(--kyo-text); }
  .badge.tak{ background:var(--tak-dim); color:var(--tak-text); }
  .badge.kan{ background:var(--kan-dim); color:var(--kan-text); }

  .block{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 17px; margin-bottom:12px; }
  .block-label{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .block--transit{ background:var(--transit-bg); border-color:var(--transit-border); }
  .block--transit .block-label{ color:var(--transit-icon); }
  .block--hotel{ background:var(--hotel-bg); border-color:var(--hotel-border); }
  .block--hotel .block-label{ color:var(--hotel-icon); }

  .leg{ margin-bottom:10px; }
  .leg:last-child{ margin-bottom:0; }
  .route{ display:flex; align-items:center; justify-content:space-between; }
  .route .pt{ text-align:center; }
  .route .pt .code{ font-family:'Fraunces', serif; font-size:19px; font-weight:500; }
  .route .pt .time{ font-size:13.5px; color:var(--text-dim); margin-top:2px; }
  .route .mid{ flex:1; display:flex; flex-direction:column; align-items:center; padding:0 10px; color:var(--text-faint); }
  .route .mid .line{ width:100%; height:1px; background:var(--line); position:relative; margin:4px 0; }
  .route .mid .line:after{ content:"🚅"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--transit-bg); padding:0 6px; font-size:13px; }
  .route .mid .dur{ font-size:11.5px; }
  .change{ font-size:11.5px; color:var(--text-faint); text-align:center; padding:6px 0; font-style:italic; }
  .meta-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-dim); padding-top:9px; border-top:1px solid var(--line); margin-top:9px; }

  .hotel-name{ font-family:'Fraunces', serif; font-size:19px; font-weight:500; margin-bottom:6px; }
  .addr{ font-size:14px; color:var(--text-dim); margin-bottom:10px; }
  .hoursrow{ display:flex; gap:20px; font-size:13.5px; }
  .hoursrow div span{ display:block; color:var(--text-dim); font-size:11px; margin-bottom:2px;}

  .tip{ font-size:14px; line-height:1.55; color:var(--text); }
  .tip strong{ color:var(--kan); font-weight:600; }
  .tip + .tip{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }

  .maplink{ display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:5px; color:var(--text-faint); vertical-align:middle; opacity:.85; transition:opacity .15s ease, color .15s ease, transform .15s ease; }
  .maplink svg{ width:100%; height:100%; fill:currentColor; }
  .maplink:hover{ color:var(--kan); opacity:1; }
  .maplink:active{ transform:scale(0.85); }

  .plan{ display:flex; gap:13px; padding:12px 0; }
  .plan:not(:last-child){ border-bottom:1px solid var(--line); }
  .plan .when{ width:56px; flex-shrink:0; font-size:12.5px; color:var(--text-dim); padding-top:1px; }
  .plan .what strong{ display:block; font-size:15px; font-weight:600; margin-bottom:3px; }
  .plan .what p{ margin:0; font-size:13.5px; color:var(--text-dim); line-height:1.5; }
  .plan .what .alt{ display:block; margin-top:5px; font-size:12.5px; color:var(--text-faint); font-style:italic; }
  .plan .what .hours{ display:inline-block; margin-top:6px; font-size:12px; color:var(--kan); font-style:italic; }
  .plan .what .cash{ display:inline-block; margin-top:6px; margin-left:10px; font-size:12px; color:var(--text-faint); font-style:italic; }

  .block--calm{ background:var(--kan-dim); border-color:var(--kan-border); display:flex; gap:12px; align-items:flex-start; }
  .block--calm .calm-icon{ font-family:'Fraunces', serif; font-size:20px; color:var(--kan); line-height:1.3; flex-shrink:0; }
  .block--calm .tip{ color:var(--kan-text); }

  .navrow{ display:flex; justify-content:space-between; margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
  .navbtn{ background:none; border:none; color:var(--text-dim); font-family:'IBM Plex Sans', sans-serif; font-size:14px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .navbtn.next{ text-align:right; align-items:flex-end; }
  .navbtn span{ font-size:11.5px; color:var(--text-dim); }
  .navbtn:active{ opacity:.6; }
  .navbtn.hidden{ visibility:hidden; }

  .words-legend{ border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:13px; line-height:1.6; background:var(--surface-hi); color:var(--text); }
  .words-legend b{ font-family:'Fraunces', serif; font-weight:600; color:var(--kan); }
  .words-legend .rules{ margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; }
  .prow{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); }
  .prow:last-child{ border-bottom:none; }
  .prow .pen{ font-size:13px; color:var(--text-dim); flex-shrink:0; width:42%; padding-top:2px; }
  .prow .pnative{ text-align:right; }
  .prow .pjp{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; }
  .prow .proma{ font-size:12px; color:var(--text-dim); font-style:italic; margin-top:2px; }

  .theme-toggle{ position:fixed; top:22px; right:20px; width:38px; height:38px; border-radius:50%; background:var(--toggle-bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20; transition:background .25s ease, border-color .25s ease, transform .15s ease; }
  .theme-toggle:active{ transform:scale(0.92); }
  .theme-toggle svg{ width:18px; height:18px; stroke:var(--toggle-icon); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  @media (prefers-color-scheme: light){
    html:not([data-theme="dark"]) .theme-toggle .icon-moon{ display:none; }
    html:not([data-theme="dark"]) .theme-toggle .icon-sun{ display:block; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

<div class="app">
  <div class="eyebrow">TRIP · 30 SEP – 14 OCT 2026</div>
  <h1>Tokyo, Kyoto, Takayama <span style="color:var(--text-faint); font-style:italic; font-weight:400;">&amp;</span> Kanazawa</h1>
  <div class="daterange">
    <span>15 days · 4 cities · trains between them</span>
    <button class="word-link" id="linkWords" type="button" onclick="selectWords()">日本語 Words</button>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="weekgrid" id="week"></div>
  <div class="weekgrid-note">
    <span><i style="background:var(--tok)"></i>Tokyo</span>
    <span><i style="background:var(--kyo)"></i>Kyoto</span>
    <span><i style="background:var(--tak)"></i>Takayama</span>
    <span><i style="background:var(--kan)"></i>Kanazawa</span>
    <span>dashed = day trip</span>
  </div>
  <div class="week-divider"></div>

  <div class="panel" id="panel"></div>
</div>

<script>
const PIN_SVG = '<svg viewBox="0 0 24 24"><path d="M12 21s-7-7.05-7-12a7 7 0 1 1 14 0c0 4.95-7 12-7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>';
function pin(query){
  return `<a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}" target="_blank" rel="noopener" aria-label="Open in Google Maps">${PIN_SVG}</a>`;
}

// ---- shared block renderers ----
function hotelBlock(name, mapQuery, addr, checkin, checkout, note){
  return `
    <div class="block block--hotel">
      <div class="block-label">Stay</div>
      <div class="hotel-name">${name}${mapQuery ? pin(mapQuery) : ''}</div>
      ${addr ? `<div class="addr">${addr}</div>` : ''}
      ${checkin || checkout ? `<div class="hoursrow">
        <div><span>Check-in</span>${checkin || '—'}</div>
        <div><span>Check-out</span>${checkout || '—'}</div>
      </div>` : ''}
      ${note ? `<div class="addr" style="margin-top:8px;margin-bottom:0;">${note}</div>` : ''}
    </div>`;
}

function transitBlock(label, legs){
  const legsHtml = legs.map((leg, i) => `
    ${i > 0 ? `<div class="change">Change at ${leg.changeAt || leg.from.code} — ${leg.changeGap || ''}</div>` : ''}
    <div class="leg">
      <div class="route">
        <div class="pt"><div class="code">${leg.from.code}</div><div class="time">${leg.from.time}</div></div>
        <div class="mid"><div class="line"></div><div class="dur">${leg.dur}</div></div>
        <div class="pt"><div class="code">${leg.to.code}</div><div class="time">${leg.to.time}</div></div>
      </div>
      <div class="meta-row"><span>${leg.train}</span><span>${leg.note || ''}</span></div>
    </div>
  `).join('');
  return `<div class="block block--transit"><div class="block-label">${label}</div>${legsHtml}</div>`;
}

function planBlock(label, rows){
  const rowsHtml = rows.map(r => `
    <div class="plan">
      <div class="when">${r.when}</div>
      <div class="what">
        <strong>${r.what}</strong>
        ${r.p ? `<p>${r.p}</p>` : ''}
        ${r.alt ? `<span class="alt">Alternatively: ${r.alt}</span>` : ''}
        ${r.hours ? `<span class="hours">${r.hours}</span>` : ''}
        ${r.cash ? `<span class="cash">💴 ${r.cash}</span>` : ''}
      </div>
    </div>
  `).join('');
  return `<div class="block"><div class="block-label">${label}</div>${rowsHtml}</div>`;
}

function tipBlock(label, tips){
  return `<div class="block"><div class="block-label">${label}</div>${tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div>`;
}

function calmBlock(text){
  return `<div class="block block--calm"><div class="calm-icon">◡</div><div class="tip">${text}</div></div>`;
}

// ---- trip data ----
const CITY_NAMES = { tok:"Tokyo", kyo:"Kyoto", tak:"Takayama", kan:"Kanazawa" };

const days = [
{ id:0, date:"30 September", weekday:"Wednesday", month:"SEP", num:30, city:"tok", travel:true,
  title:"Home → Tokyo",
  render:()=>`
    <div class="detail-date">Wednesday, 30 September</div>
    <div class="detail-title">Home → Tokyo</div>
    <span class="badge tok">ARRIVAL DAY · TOKYO</span>
    ${hotelBlock("Tokyo hotel", null, null, "3:00pm", null, "Not named in the source plan yet. “Head back to hotel to officially check in, rest until undisclosed time.”")}
    ${planBlock("Morning", [
      {when:"", what:"Arrive Haneda"+pin("Haneda Airport"), p:"Collect bags — immigration/customs, train to hotel and drop bags at hotel."},
      {when:"", what:"Tokyo National Museum"+pin("Tokyo National Museum"), p:"Huge collection covering samurai armor, ceramics, and Buddhist art.", hours:"9:30–17:00 (Fri/Sat to 20:00) · closed Mon · ¥1,000 (~£5)"}
    ])}
    ${planBlock("Early Afternoon", [
      {when:"", what:"National Museum of Western Art"+pin("National Museum of Western Art Tokyo"), p:"Monet, Rodin, and other Western masters — Le Corbusier‑designed building.", hours:"9:30–17:30 (Fri/Sat to 20:00) · closed Mon · ¥500 (~£2.50)"},
      {when:"Lunch", what:"Ueno"+pin("Ueno Park Tokyo"), p:"Grab something in the park or Museum cafes."},
      {when:"", what:"Shitamachi Museum"+pin("Shitamachi Museum Tokyo"), p:"Small, atmospheric recreation of old Tokyo shopping street life.", hours:"9:30–16:30, last entry 16:00 · closed Mon · ¥300 (~£1.50)", cash:"small museum — cash handy as backup"}

const wordsLegend = `<b>How to read it</b> — the transliteration is the important bit, since kanji/kana can't be sounded out on sight. Vowels are short and pure (a‑i‑u‑e‑o, as in "father, machine, rule, met, so"); a bar or double vowel means hold it a beat longer.
  <div class="rules">
    <span><b>tsu</b> = quick "ts" (cats)</span>
    <span><b>r</b> = soft, between "r" and "l"</span>
    <span><b>fu</b> = light, breathy "f"</span>
    <span><b>ei</b> = long "ay"</span>
  </div>`;

function renderWords(){
  let html = `<div class="detail-date">PHRASEBOOK</div><div class="detail-title">Japanese</div>`;
  html += `<div class="words-legend">${wordsLegend}</div>`;
  wordCategories.forEach(cat => {
    html += `<div class="block"><div class="block-label">${cat.title}</div>`;
    cat.rows.forEach(r => {
      html += `<div class="prow"><div class="pen">${r[0]}</div><div class="pnative"><div class="pjp">${r[1]}</div>${r[2] ? `<div class="proma">${r[2]}</div>` : ''}</div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ---- timeline (proportional by day count per city) ----
const timeline = document.getElementById('timeline');
const cityCounts = {};
days.forEach(d => cityCounts[d.city] = (cityCounts[d.city]||0) + 1);
let lastCity = null;
Object.keys(cityCounts).forEach(c => {}); // no-op, order comes from first appearance below
const cityOrder = [];
days.forEach(d => { if (!cityOrder.includes(d.city)) cityOrder.push(d.city); });
cityOrder.forEach(c => {
  const seg = document.createElement('div');
  seg.className = `seg ${c}`;
  seg.style.flex = cityCounts[c];
  seg.textContent = CITY_NAMES[c].toUpperCase();
  timeline.appendChild(seg);
});

// ---- today/past highlighting (visitor's real device date) ----
const today = new Date();
today.setHours(0,0,0,0);

days.forEach(d => {
  const monthIdx = d.month === 'SEP' ? 8 : 9; // this trip only spans September and October
  d.dateObj = new Date(2026, monthIdx, d.num);
  d.dateObj.setHours(0,0,0,0);
});

let todayIdx = days.findIndex(d => d.dateObj.getTime() === today.getTime());
let defaultId = 0;
if (todayIdx >= 0) defaultId = todayIdx;
else if (today.getTime() > days[days.length - 1].dateObj.getTime()) defaultId = days.length - 1;

// ---- day grid ----
const week = document.getElementById('week');
const dayEls = [];
days.forEach((d, i) => {
  const el = document.createElement('div');
  const isPast = d.dateObj.getTime() < today.getTime();
  const isToday = i === todayIdx;
  el.className = `day ${d.city}${d.travel ? ' travel' : ''}${d.trip ? ' trip' : ''}${isPast ? ' past' : ''}${isToday ? ' today' : ''}`;
  el.innerHTML = `<div class="num">${d.num}</div><div class="mon">${d.month}</div><div class="dot"></div>`;
  el.addEventListener('click', () => selectDay(d.id));
  week.appendChild(el);
  dayEls.push(el);
});

const panel = document.getElementById('panel');
const linkWords = document.getElementById('linkWords');
let selected = {type:'day', id:0};

function updateSelection(){
  dayEls.forEach((el, i) => el.classList.toggle('selected', selected.type === 'day' && selected.id === i));
  linkWords.classList.toggle('selected', selected.type === 'words');
}

function selectDay(id){
  selected = {type:'day', id};
  updateSelection();
  const d = days[id];
  const prev = days[id-1];
  const next = days[id+1];
  panel.innerHTML = `
    ${d.render()}
    <div class="navrow">
      <button class="navbtn ${prev ? '' : 'hidden'}" onclick="selectDay(${id-1})"><span>← Previous</span>${prev ? prev.weekday : ''}</button>
      <button class="navbtn next ${next ? '' : 'hidden'}" onclick="selectDay(${id+1})"><span>Next →</span>${next ? next.weekday : ''}</button>
    </div>
  `;
}

function selectWords(){
  selected = {type:'words', id:'words'};
  updateSelection();
  panel.innerHTML = renderWords();
}

selectDay(defaultId);

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light'
    || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
});
</script>
