<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bucharest &amp; Sofia — 26 Oct to 1 Nov</title>
<script>
  (function(){
    var m = location.search.match(/[?&]theme=(light|dark)/);
    if (m) document.documentElement.setAttribute('data-theme', m[1]);
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#14181C;
    --surface:#1D242A;
    --surface-hi:#262F37;
    --line:#313B43;
    --rust:#BE5F35;
    --rust-dim:#5A3324;
    --rust-text:#F0C4A8;
    --rust-border:#4A2E22;
    --gold:#D4A64C;
    --gold-dim:#5C4A26;
    --gold-text:#F0D999;
    --gold-border:#4A3D22;
    --text:#F3EEE3;
    --text-dim:#A3AFB8;
    --text-faint:#7C8A94;
    --toggle-bg:#262F37;
    --toggle-icon:#D4A64C;
    --flight-bg:#132A20;
    --flight-border:#3FA06B;
    --flight-icon:#7FDDA5;
    --hotel-bg:#241D14;
    --hotel-border:#B08838;
    --hotel-icon:#E4BE6F;
    color-scheme: dark;
  }

  html[data-theme="light"]{
    --bg:#F6F1E6;
    --surface:#FFFFFF;
    --surface-hi:#F1EADC;
    --line:#E3D9C6;
    --rust:#A8501F;
    --rust-dim:#F1DAC3;
    --rust-text:#8C3E17;
    --rust-border:#E3C6A8;
    --gold:#A9791F;
    --gold-dim:#F3E6BE;
    --gold-text:#7A5813;
    --gold-border:#E3CE8F;
    --text:#241F18;
    --text-dim:#5C5042;
    --text-faint:#7A6F60;
    --toggle-bg:#FFFFFF;
    --toggle-icon:#A9791F;
    --flight-bg:#E3F3EA;
    --flight-border:#2F7D4F;
    --flight-icon:#1F6E45;
    --hotel-bg:#FBF2DF;
    --hotel-border:#A9791F;
    --hotel-icon:#7A5813;
    color-scheme: light;
  }

  body{ transition: background .25s ease, color .25s ease; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    padding:28px 20px 60px;
    position:relative;
    min-height:100vh;
  }

  /* ---- Header ---- */
  .eyebrow{
    font-size:13.5px;
    color:var(--text-dim);
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-size:32px;
    line-height:1.12;
    margin:0 0 4px;
  }
  h1 .and{
    color:var(--text-faint);
    font-style:italic;
    font-weight:400;
  }
  .daterange{
    color:var(--text-dim);
    font-size:15.5px;
    margin-bottom:26px;
  }

  /* ---- City timeline bar ---- */
  .timeline{
    display:flex;
    height:40px;
    border-radius:9px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .timeline .seg{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .timeline .buc{
    flex:3;
    background:var(--rust-dim);
    color:var(--rust-text);
    border-right:1px solid var(--bg);
  }
  .timeline .sof{
    flex:3;
    background:var(--gold-dim);
    color:var(--gold-text);
  }

  .word-link{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    text-decoration:none;
    border:1px solid currentColor;
    color:inherit;
    background:none;
    appearance:none;
    -webkit-appearance:none;
    font-family:inherit;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    opacity:.85;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease, background .15s ease, color .15s ease;
  }
  .word-link:active{ transform:scale(0.94); opacity:1; }
  .word-link.selected{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
    opacity:1;
  }

  /* ---- Words panel ---- */
  .words-legend{
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:14px;
    font-size:13px;
    line-height:1.6;
  }
  .words-legend b{ font-family:'Fraunces', serif; font-weight:600; }
  .words-legend .rules{ margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; }
  .words-ro .words-legend{ background:var(--rust-dim); color:var(--rust-text); }
  .words-bg .words-legend{ background:var(--gold-dim); color:var(--gold-text); }
  .words-ro .block-label{ color:var(--rust); }
  .words-bg .block-label{ color:var(--gold); }

  .prow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line);
  }
  .prow:last-child{ border-bottom:none; }
  .prow .pen{ font-size:13.5px; color:var(--text-dim); flex-shrink:0; width:40%; padding-top:2px; }
  .prow .pnative{ text-align:right; }
  .prow .plat, .prow .pcyr{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; }
  .prow .ptranslit{ font-size:12px; color:var(--text-faint); font-style:italic; margin-top:2px; }
  .words-ro .ptranslit b, .words-bg .ptranslit b{ font-style:normal; }
  .words-ro .ptranslit b{ color:var(--rust); }
  .words-bg .ptranslit b{ color:var(--gold); }

  /* ---- Week grid (calendar) ---- */
  .weeklabels{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    font-size:11px;
    font-weight:600;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:8px;
  }
  .week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:36px;
  }
  .day{
    aspect-ratio:1/1.18;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:6px 2px;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    position:relative;
  }
  .day:active{ transform:scale(0.94); }
  .day:hover{ background:var(--surface-hi); }
  .day .num{
    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:600;
    line-height:1;
  }
  .day .mon{
    font-size:10px;
    font-weight:600;
    color:var(--text-dim);
    margin-top:2px;
    letter-spacing:.03em;
  }
  .day .dot{
    width:5px;height:5px;border-radius:50%;
    margin-top:5px;
  }
  .day.buc{ border-color:var(--rust-border); }
  .day.buc .dot{ background:var(--rust); }
  .day.sof{ border-color:var(--gold-border); }
  .day.sof .dot{ background:var(--gold); }
  .day.travel{
    background:linear-gradient(135deg, var(--rust-dim), var(--gold-dim));
  }
  .day.travel .num{ color:#fff; }
  .day.selected{
    background:var(--text);
    border-color:var(--text);
  }
  .day.selected .num,
  .day.selected .mon{ color:var(--bg); }
  .day.selected .dot{ background:var(--bg); }

  /* ---- Inline day panel ---- */
  .panel{
    animation:panelIn .25s ease;
  }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .detail-date{
    font-size:13.5px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .detail-title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:28px;
    margin:0 0 22px;
    line-height:1.15;
  }

  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:22px;
    letter-spacing:.02em;
  }
  .badge.buc{ background:var(--rust-dim); color:var(--rust-text); }
  .badge.sof{ background:var(--gold-dim); color:var(--gold-text); }

  .block{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .block-label{
    font-size:11.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .block--flight{
    background:var(--flight-bg);
    border-color:var(--flight-border);
  }
  .block--flight .block-label{ color:var(--flight-icon); }
  .block--hotel{
    background:var(--hotel-bg);
    border-color:var(--hotel-border);
  }
  .block--hotel .block-label{ color:var(--hotel-icon); }
  .route{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .route .pt{ text-align:center; }
  .route .pt .code{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:500;
  }
  .route .pt .time{
    font-size:14px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .route .pt .tz{
    font-size:10.5px;
    color:var(--text-faint);
    margin-top:1px;
    letter-spacing:.02em;
  }
  .route .mid{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 12px;
    color:var(--text-faint);
  }
  .route .mid .line{
    width:100%;
    height:1px;
    background:var(--line);
    position:relative;
    margin:4px 0;
  }
  .route .mid .line:after{
    content:"✈";
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:var(--flight-bg);
    padding:0 6px;
    font-size:13px;
  }
  .route .mid .dur{ font-size:12px; }
  .meta-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--text-dim);
    padding-top:10px;
    border-top:1px solid var(--line);
    margin-top:10px;
  }

  .hotel-name{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:500;
    margin-bottom:6px;
  }
  .addr{ font-size:14.5px; color:var(--text-dim); margin-bottom:10px; }
  .hoursrow{
    display:flex;
    gap:20px;
    font-size:14px;
  }
  .hoursrow div span{ display:block; color:var(--text-dim); font-size:11.5px; margin-bottom:2px;}

  .tip{
    font-size:14.5px;
    line-height:1.55;
    color:var(--text);
  }
  .tip strong{ color:var(--gold); font-weight:600; }
  .tip + .tip{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }

  .open-day{
    padding:30px 4px;
    text-align:center;
    color:var(--text-dim);
    font-size:15px;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  .plan{
    display:flex;
    gap:14px;
    padding:14px 0;
  }
  .plan:not(:last-child){ border-bottom:1px solid var(--line); }
  .plan .when{
    width:58px;
    flex-shrink:0;
    font-size:13px;
    color:var(--text-dim);
    padding-top:1px;
  }
  .plan .what strong{
    display:block;
    font-size:15.5px;
    font-weight:600;
    margin-bottom:3px;
  }
  .plan .what p{
    margin:0;
    font-size:14px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .plan .what .hours{
    display:inline-block;
    margin-top:6px;
    font-size:12.5px;
    color:var(--gold);
    font-style:italic;
  }

  .navrow{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .navbtn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .navbtn.next{ text-align:right; align-items:flex-end; }
  .navbtn span{ font-size:12px; color:var(--text-dim); }
  .navbtn:active{ opacity:.6; }
  .navbtn.hidden{ visibility:hidden; }

  /* ---- Theme toggle ---- */
  .theme-toggle{
    position:fixed;
    top:22px;
    right:20px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--toggle-bg);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
    transition:background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .theme-toggle:active{ transform:scale(0.92); }
  .theme-toggle svg{
    width:18px;
    height:18px;
    stroke:var(--toggle-icon);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

<div class="app">
  <div class="eyebrow">TRIP · 26 OCT – 1 NOV 2026</div>
  <h1>Bucharest <span class="and">&amp;</span> Sofia</h1>
  <div class="daterange">7 days · 2 cities · one flight between them</div>

  <div class="timeline">
    <div class="seg buc">
      <span>BUCHAREST</span>
      <button class="word-link" id="linkRomanian" type="button" onclick="selectWords('ro')">Words</button>
    </div>
    <div class="seg sof">
      <span>SOFIA</span>
      <button class="word-link" id="linkBulgarian" type="button" onclick="selectWords('bg')">Words</button>
    </div>
  </div>

  <div class="weeklabels">
    <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
  </div>
  <div class="week" id="week"></div>

  <div class="panel" id="panel"></div>
</div>

<script>
const days = [
  {
    id:0, weekday:"Monday", date:"26 October", month:"OCT", num:26, city:"buc", travel:true,
    title:"London → Bucharest",
    render: () => `
      <div class="detail-date">Monday, 26 October</div>
      <div class="detail-title">London → Bucharest</div>
      <span class="badge buc">ARRIVAL DAY · BUCHAREST</span>

      <div class="block block--flight">
        <div class="block-label">Flight</div>
        <div class="route">
          <div class="pt"><div class="code">LHR</div><div class="time">09:50</div><div class="tz">GMT</div></div>
          <div class="mid"><div class="line"></div><div class="dur">3h 15m · direct</div></div>
          <div class="pt"><div class="code">OTP</div><div class="time">15:05</div><div class="tz">EET · UTC+2</div></div>
        </div>
        <div class="meta-row"><span>British Airways · BA874</span><span>Ref: YCLF6E</span></div>
      </div>

      <div class="block block--hotel">
        <div class="block-label">Stay</div>
        <div class="hotel-name">Hotel Berthelot</div>
        <div class="addr">Bulevardul Berthelot 9, Sector 1, Bucharest</div>
        <div class="hoursrow">
          <div><span>Check-in</span>from 14:00</div>
          <div><span>Check-out</span>until 12:00</div>
        </div>
      </div>

      <div class="block">
        <div class="block-label">Airport → hotel</div>
        <div class="tip"><strong>Taxi/Bolt</strong> is simplest after landing — order via the kiosks in Arrivals or the app. ~80–100 RON, 30–40 min.</div>
        <div class="tip"><strong>Bus 783</strong> runs from right outside Arrivals to the centre (Piața Unirii), ~4.5 RON.</div>
      </div>

      <div class="block">
        <div class="block-label">Suggested evening</div>
        <div class="plan"><div class="when">Settle in</div><div class="what"><strong>Check in, freshen up</strong><p>You'll land mid-afternoon and be at the hotel by ~16:30 — no need to rush straight out.</p></div></div>
        <div class="plan"><div class="when">Evening</div><div class="what"><strong>Old Town (Lipscani)</strong><p>Ten minutes' walk from the hotel. Wander the cobbled streets, pop into Stavropoleos Monastery if it's still open, and pick a restaurant for dinner — easy first night, nothing to plan ahead.</p></div></div>
      </div>
    `
  },
  {
    id:1, weekday:"Tuesday", date:"27 October", month:"OCT", num:27, city:"buc", travel:false,
    title:"Bucharest",
    render: () => `
      <div class="detail-date">Tuesday, 27 October</div>
      <div class="detail-title">In Bucharest</div>
      <span class="badge buc">BUCHAREST</span>

      <div class="block">
        <div class="block-label">Suggested day</div>
        <div class="plan"><div class="when">Morning</div><div class="what"><strong>Palace of the Parliament</strong><p>The must-see — second-largest administrative building in the world. Guided tours only; worth booking a slot in advance rather than turning up.</p><span class="hours">Open 9am–5pm daily</span></div></div>
        <div class="plan"><div class="when">Midday</div><div class="what"><strong>Calea Victoriei</strong><p>Walk the grand boulevard from the Palace area up past the Romanian Athenaeum — good for lunch along the way.</p></div></div>
        <div class="plan"><div class="when">Afternoon</div><div class="what"><strong>Herăstrău Park &amp; Village Museum</strong><p>A short taxi or metro ride north. The open-air museum of traditional Romanian houses is a nice change of pace, and the park itself is pleasant for a stroll by the lake.</p><span class="hours">Museum open 9am–5pm daily (winter hours by late Oct)</span></div></div>
        <div class="plan"><div class="when">Evening</div><div class="what"><strong>Option: concert at the Athenaeum</strong><p>There's a concert at the Romanian Athenaeum on this evening at 7pm that could be worth it — since it lines up with the day you're already in the centre for the Palace of the Parliament and Calea Victoriei. Dinner could shift earlier or later around it.</p></div></div>
        <div class="plan"><div class="when">Evening</div><div class="what"><strong>Dinner back in the centre</strong><p>Head back towards Old Town or Calea Victoriei for dinner. Worth keeping an ear out too — Bucharest's smaller churches occasionally host organ or chamber recitals of an evening, a nice low-key alternative to a big concert hall if you spot a poster on the way past.</p></div></div>
      </div>
    `
  },
  {
    id:2, weekday:"Wednesday", date:"28 October", month:"OCT", num:28, city:"buc", travel:false,
    title:"Bucharest",
    render: () => `
      <div class="detail-date">Wednesday, 28 October</div>
      <div class="detail-title">In Bucharest</div>
      <span class="badge buc">BUCHAREST</span>

      <div class="block">
        <div class="block-label">Suggested day</div>
        <div class="plan"><div class="when">Morning</div><div class="what"><strong>Romanian Athenaeum — visit the building</strong><p>Best in the morning, when there's no rehearsal or concert restricting access. Self-guided entry to the foyer and the main hall, with its huge fresco of Romanian history circling the walls — worth it for the interior alone, no concert required.</p><span class="hours">Open ~9:30am–5:30pm, small entry fee (~10 RON); access may be limited if a rehearsal is on</span></div></div>
        <div class="plan"><div class="when">Midday</div><div class="what"><strong>Coffee in Old Town</strong><p>Maybe a browse through Cărturești Carusel, the six-storey bookshop housed in a restored 19th-century building nearby.</p><span class="hours">Cărturești Carusel open 10am–10pm Mon–Wed</span></div></div>
        <div class="plan"><div class="when">Afternoon</div><div class="what"><strong>Curtea Veche &amp; Manuc's Inn</strong><p>Worth knowing before you go: the Old Princely Court ruins themselves have been closed to the public for restoration for some years, so it's an exterior stop — the courtyard and Vlad the Impaler bust are visible from the street. Manuc's Inn right next door is open as normal, with a lovely covered courtyard for coffee or a late lunch.</p><span class="hours">Manuc's Inn open 8am–midnight (till 2am Fri/Sat)</span></div></div>
        <div class="plan"><div class="when">Evening</div><div class="what"><strong>Look for a concert in a smaller venue</strong><p>Rather than a big philharmonic night, Bucharest's churches often host organ or chamber recitals that are easy to stumble into — St. Joseph's Catholic Cathedral is literally on the same street as Hotel Berthelot, and the Anglican Church of the Resurrection runs an occasional recital series too. These aren't usually on the big ticketing sites — check posters at the door or local listings once you're there.</p></div></div>
      </div>
    `
  },
  {
    id:3, weekday:"Thursday", date:"29 October", month:"OCT", num:29, city:"buc", travel:true,
    title:"Bucharest → Sofia",
    render: () => `
      <div class="detail-date">Thursday, 29 October</div>
      <div class="detail-title">Bucharest → Sofia</div>
      <span class="badge buc">DEPARTURE DAY · BUCHAREST → SOFIA</span>

      <div class="block">
        <div class="block-label">Suggested morning</div>
        <div class="plan"><div class="when">Morning</div><div class="what"><strong>Check out by 12:00</strong><p>Leave bags with the hotel if they'll hold them — no need to lug them round.</p></div></div>

const romanianLegend = `<b>How to read it</b> — Romanian is spelled the way it sounds, once you know five letters:
  <div class="rules">
    <span><b>ă</b> = "a" in "about"</span>
    <span><b>â / î</b> = flat "uh"</span>
    <span><b>ș</b> = "sh"</span>
    <span><b>ț</b> = "ts"</span>
    <span><b>ce/ci</b> = "che/chi"</span>
    <span><b>ghe/ghi</b> = hard "ge/gi"</span>
  </div>`;

const bulgarianLegend = `<b>How to read it</b> — the transliteration is the important bit, since you can't sound out Cyrillic on sight. Stress is marked in CAPS.
  <div class="rules">
    <span><b>х</b> = "ch" (loch)</span>
    <span><b>ъ</b> = flat "uh"</span>
    <span><b>ж</b> = "zh" (measure)</span>
    <span><b>ш</b> = "sh"</span>
  </div>`;

function renderRomanian(){
  let html = `<div class="detail-date">PHRASEBOOK</div><div class="detail-title">Romanian</div><div class="words-ro">`;
  html += `<div class="words-legend">${romanianLegend}</div>`;
  romanianCategories.forEach(cat => {
    html += `<div class="block"><div class="block-label">${cat.title}</div>`;
    cat.rows.forEach(r => {
      html += `<div class="prow"><div class="pen">${r[0]}</div><div class="pnative"><div class="plat">${r[1]}</div></div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function renderBulgarian(){
  let html = `<div class="detail-date">PHRASEBOOK</div><div class="detail-title">Bulgarian</div><div class="words-bg">`;
  html += `<div class="words-legend">${bulgarianLegend}</div>`;
  bulgarianCategories.forEach(cat => {
    html += `<div class="block"><div class="block-label">${cat.title}</div>`;
    cat.rows.forEach(r => {
      html += `<div class="prow"><div class="pen">${r[0]}</div><div class="pnative"><div class="pcyr">${r[1]}</div><div class="ptranslit">${r[2]}</div></div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

const week = document.getElementById('week');
const dayEls = [];
days.forEach(d => {
  const el = document.createElement('div');
  el.className = `day ${d.city}${d.travel ? ' travel' : ''}`;
  el.innerHTML = `<div class="num">${d.num}</div><div class="mon">${d.month}</div><div class="dot"></div>`;
  el.addEventListener('click', () => selectDay(d.id));
  week.appendChild(el);
  dayEls.push(el);
});

const panel = document.getElementById('panel');
const linkRomanian = document.getElementById('linkRomanian');
const linkBulgarian = document.getElementById('linkBulgarian');
let selected = {type:'day', id:0};

function updateSelection(){
  dayEls.forEach((el, i) => el.classList.toggle('selected', selected.type === 'day' && selected.id === i));
  linkRomanian.classList.toggle('selected', selected.type === 'words' && selected.id === 'ro');
  linkBulgarian.classList.toggle('selected', selected.type === 'words' && selected.id === 'bg');
}

function selectDay(id){
  selected = {type:'day', id};
  updateSelection();

  const d = days[id];
  const prev = days[id-1];
  const next = days[id+1];
  panel.innerHTML = `
    ${d.render()}
    <div class="navrow">
      <button class="navbtn ${prev ? '' : 'hidden'}" onclick="selectDay(${id-1})"><span>← Previous</span>${prev ? prev.weekday : ''}</button>
      <button class="navbtn next ${next ? '' : 'hidden'}" onclick="selectDay(${id+1})"><span>Next →</span>${next ? next.weekday : ''}</button>
    </div>
  `;
}

function selectWords(lang){
  selected = {type:'words', id:lang};
  updateSelection();
  panel.innerHTML = lang === 'ro' ? renderRomanian() : renderBulgarian();
}

selectDay(0);

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
});
</script>
